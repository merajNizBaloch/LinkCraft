name: Build Check

on:
  push:
    branches:
      - working
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Build Next.js
        env:
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_SECRET_KEY: sb_secret_build_check
          LINKCRAFT_PUBLIC_URL: http://localhost:3000
        run: npm run build
